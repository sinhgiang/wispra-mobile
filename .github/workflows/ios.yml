# Checks that the iOS app, the Wispra keyboard extension among it, compiles, on GitHub's macOS
# machines (free for this public repository). Nothing is signed, uploaded or sent to Apple; the
# signed TestFlight build stays on Codemagic (codemagic.yaml), started by a pushed build-* tag
# (see CLAUDE.md). This catches compile errors early, before a commit is tagged for a build.

name: iOS compile check

on:
  push:
    branches:
      - 'helme/mobile-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 57 needs a recent Xcode 26: 26.1 is too old for expo-modules-jsi and 26.2/26.3
      # reject one of its headers; 26.6 on macos-26 builds it
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The keyboard's Telex typing and key logic (Foundation only), as a small test program
      - name: Swift tests of the Wispra keyboard
        run: |
          # The app and the keyboard share one SharedChannel.swift, kept as two identical copies
          diff targets/keyboard/SharedChannel.swift modules/wispra-keyboard-bridge/ios/SharedChannel.swift
          swiftc -parse-as-library targets/keyboard/Telex.swift targets/keyboard/KeyboardLogic.swift modules/wispra-keyboard-bridge/ios/Segmenter.swift targets-tests/keyboard/KeyboardTests.swift -o "$RUNNER_TEMP/keyboard-tests"
          "$RUNNER_TEMP/keyboard-tests"

      # The real keyboard code (KeyboardViewController) in a small app on the iOS simulator: it loads,
      # lays out its keys and has them tapped; a crash fails this step (see Harness.swift)
      - name: Wispra keyboard on the iOS simulator
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Harness.app"
          mkdir -p "$APP"
          cp targets-tests/keyboard-sim/Info.plist "$APP/Info.plist"
          xcrun -sdk iphonesimulator swiftc -target arm64-apple-ios16.4-simulator -module-name WispraKeyboard -parse-as-library \
            targets/keyboard/Telex.swift targets/keyboard/KeyboardLogic.swift targets/keyboard/KeyboardViewController.swift \
            targets/keyboard/SharedChannel.swift modules/wispra-keyboard-bridge/ios/KeyboardSession.swift \
            modules/wispra-keyboard-bridge/ios/Segmenter.swift targets-tests/keyboard-sim/Harness.swift \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __entitlements -Xlinker targets-tests/keyboard-sim/Harness.entitlements \
            -o "$APP/Harness"
          # With a keychain group like the app's and the keyboard's, so the shared keychain is tested.
          # On the simulator the entitlements live in the binary (as Xcode does it); a plain ad-hoc
          # signature then, since signed-in entitlements make the simulator refuse to open the app.
          codesign --force --sign - "$APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devices.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          ')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          perl -e 'alarm 300; exec @ARGV' xcrun simctl launch --console-pty --terminate-running-process "$UDID" com.sinhgiang.wispra.keyboardharness > harness.log 2>&1 || true
          cat harness.log
          xcrun simctl shutdown "$UDID" || true
          grep -q "KEYBOARD HARNESS OK" harness.log

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build for a device without signing
        run: |
          status=0
          xcodebuild -workspace ios/Wispra.xcworkspace -scheme Wispra \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1 || status=$?
          echo "::group::Errors"
          grep -E "error:" xcodebuild.log | sort -u | head -n 80 || true
          echo "::endgroup::"
          tail -n 40 xcodebuild.log
          exit $status

      # What iOS reads when it loads the keyboard: the Info.plist as built (the principal class with
      # its module name filled in), that class in the binary, the libraries it links and its size
      - name: Inspect the built keyboard extension
        run: |
          set -euo pipefail
          APPEX=$(find ~/Library/Developer/Xcode/DerivedData -path "*Release-iphoneos*" -name "*.appex" -type d | grep -v "/PlugIns/.*/PlugIns/" | head -n 1)
          echo "Extension: $APPEX"
          plutil -p "$APPEX/Info.plist"
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APPEX/Info.plist")
          PRINCIPAL=$(plutil -extract NSExtension.NSExtensionPrincipalClass raw -o - "$APPEX/Info.plist")
          echo "Principal class: $PRINCIPAL"
          otool -L "$APPEX/$EXE"
          du -sh "$APPEX"
          MODULE="${PRINCIPAL%%.*}"
          CLASS="${PRINCIPAL#*.}"
          MANGLED="_TtC${#MODULE}${MODULE}${#CLASS}${CLASS}"
          echo "Looking for the class $MANGLED"
          nm "$APPEX/$EXE" | grep "OBJC_CLASS_\$_$MANGLED"
          # The keychain group the app and the keyboard share (T-0163), in both targets' entitlements
          for f in $(find ios -name "*.entitlements" -not -path "*/Pods/*"); do echo "== $f"; cat "$f"; done
          test "$(find ios -name '*.entitlements' -not -path '*/Pods/*' -exec grep -l 'com.sinhgiang.wispramobile.shared' {} + | wc -l)" -ge 2

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
