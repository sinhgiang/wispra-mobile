# Checks that the iOS app, the Wispra keyboard extension among it, compiles, on GitHub's macOS
# machines (free for this public repository). Nothing is signed, uploaded or sent to Apple; the
# signed TestFlight build stays on Codemagic (codemagic.yaml), started by hand. This only catches
# compile errors early, before anyone presses a button there.

name: iOS compile check

on:
  push:
    branches:
      - 'helme/mobile-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 57 needs a recent Xcode 26: 26.1 is too old for expo-modules-jsi and 26.2/26.3
      # reject one of its headers; 26.6 on macos-26 builds it
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The keyboard's Telex typing and key logic (Foundation only), as a small test program
      - name: Swift tests of the Wispra keyboard
        run: |
          swiftc -parse-as-library targets/keyboard/Telex.swift targets/keyboard/KeyboardLogic.swift modules/wispra-keyboard-bridge/ios/Segmenter.swift targets-tests/keyboard/KeyboardTests.swift -o "$RUNNER_TEMP/keyboard-tests"
          "$RUNNER_TEMP/keyboard-tests"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build for a device without signing
        run: |
          status=0
          xcodebuild -workspace ios/Wispra.xcworkspace -scheme Wispra \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1 || status=$?
          echo "::group::Errors"
          grep -E "error:" xcodebuild.log | sort -u | head -n 80 || true
          echo "::endgroup::"
          tail -n 40 xcodebuild.log
          exit $status

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
