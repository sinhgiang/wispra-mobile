# iOS builds run on Codemagic because there is no Mac on the development machine.
# Both workflows start only when someone presses "Start new build" in Codemagic (no
# `triggering:` block), so pushes never use build minutes on their own.
#
# The app is an Expo project: `expo prebuild` generates the ios/ folder from app.json on the
# build machine (it is not committed), then CocoaPods and Xcode build it.

workflows:
  # Checks that the app compiles for iOS. Nothing is signed or sent to Apple.
  ios-unsigned:
    name: iOS Unsigned Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Run the tests
        script: npm test -- --ci
      - name: Generate the iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Build for a device without signing
        script: |
          xcodebuild -workspace ios/Wispra.xcworkspace -scheme Wispra \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build | xcpretty
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  # Run once before the first TestFlight build. Creates, in the Apple Developer account, the App
  # Store provisioning profile for com.sinhgiang.wispramobile, tied to the team's valid
  # distribution certificates (the one Codemagic generated for Lenvid among them), using the App
  # Store Connect API key lenvid-asc. "Fetch profiles" in Codemagic only lists profiles that already
  # exist there; after this run it lists this one. Needs no secret: the integration supplies the API
  # key, and making a profile needs only the certificates' ids, never their private keys. Does
  # nothing when the profile is already there. Signs nothing and uploads nothing.
  ios-create-profile:
    name: 'iOS: create App Store profile'
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: lenvid-asc
    environment:
      vars:
        BUNDLE_ID: com.sinhgiang.wispramobile
        PROFILE_NAME: Wispra App Store
    scripts:
      - name: Create the App Store profile if it is missing
        script: |
          #!/bin/bash
          set -euo pipefail
          # Ids from the JSON the Codemagic CLI prints (a list of Apple resources)
          ids() {
            python3 -c '
          import json, sys, datetime
          data = json.load(sys.stdin)
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          for item in data:
              exp = (item.get("attributes") or {}).get("expirationDate")
              if exp is None or exp > now:
                  print(item["id"])
          '
          }
          existing=$(app-store-connect profiles list --type IOS_APP_STORE --name "$PROFILE_NAME" --state ACTIVE --json | ids)
          if [ -n "$existing" ]; then
            echo "The profile '$PROFILE_NAME' already exists. Nothing to do."
            exit 0
          fi
          bundle=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json | ids | head -n 1)
          if [ -z "$bundle" ]; then
            echo "The bundle ID $BUNDLE_ID is not registered in the Apple Developer account."
            exit 1
          fi
          certs=$( { app-store-connect certificates list --type DISTRIBUTION --json | ids; app-store-connect certificates list --type IOS_DISTRIBUTION --json | ids; } | sort -u)
          if [ -z "$certs" ]; then
            echo "No valid distribution certificate in the Apple Developer account."
            exit 1
          fi
          echo "Distribution certificates found: $(echo "$certs" | wc -l | tr -d ' ')"
          # shellcheck disable=SC2086
          app-store-connect profiles create "$bundle" --type IOS_APP_STORE --name "$PROFILE_NAME" --certificate-ids $certs
          echo "Created the App Store profile '$PROFILE_NAME' for $BUNDLE_ID."
          echo "Next: Codemagic > Team settings > codemagic.yaml settings > Code signing identities >"
          echo "iOS provisioning profiles > Fetch profiles, select it, Reference name wispra-app-store, Download selected."

  # Signed build, uploaded to App Store Connect so it appears in TestFlight for internal
  # testers. It is never sent to App Review or to external beta review: those stay manual steps
  # in App Store Connect, done by the owner.
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # The App Store Connect API key added in Codemagic for Lenvid; one key serves every app of
      # the same Apple team. The key itself is never in this file.
      app_store_connect: lenvid-asc
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        # Codemagic fetches or creates the Apple Distribution certificate and the App Store
        # profile for this bundle id (Team settings > Code signing identities).
        distribution_type: app_store
        bundle_identifier: com.sinhgiang.wispramobile
      vars:
        # The app's numeric Apple ID in App Store Connect (App Information): "Wispra: Voice
        # Dictation", created by the owner. If it is ever emptied, the build stops with a message.
        APP_STORE_APPLE_ID: "6819026553"
    scripts:
      - name: Check the App Store Connect app
        script: |
          #!/bin/bash
          if [ -z "$APP_STORE_APPLE_ID" ]; then
            echo "APP_STORE_APPLE_ID is empty in codemagic.yaml: create the app in App Store Connect first,"
            echo "then put its Apple ID (a number) in the ios-testflight workflow."
            exit 1
          fi
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Run the tests
        script: npm test -- --ci
      - name: Generate the iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Apply signing profiles to the Xcode project
        script: xcode-project use-profiles
      - name: Set the build number
        script: |
          #!/bin/bash
          # App Store Connect refuses a build number it has already seen: take the newest one on
          # TestFlight and add one (1 before the first upload).
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          BUILD_NUMBER=$((LATEST + 1))
          echo "Latest build number on TestFlight: $LATEST. This build: $BUILD_NUMBER."
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Wispra/Info.plist
      - name: Build a signed .ipa
        script: |
          xcode-project build-ipa --workspace ios/Wispra.xcworkspace --scheme Wispra
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
